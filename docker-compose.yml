services:
  otel-lgtm:
    # Grafana with Tempo (traces), Prometheus and Loki in one container; the
    # backend sends traces and log lines over OTLP/HTTP (ADR-0002).
    image: grafana/otel-lgtm:0.36.0
    container_name: app-otel-lgtm
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3000}:3000"  # Grafana UI (admin/admin)
      - "127.0.0.1:${OTLP_HOST_PORT:-4318}:4318"  # OTLP/HTTP, for a backend run from a local venv

  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
      target: development
    container_name: app-backend
    ports:
      - "8000:8000"
      - "5678:5678"  # debugpy remote attach
    volumes:
      - ./src/backend:/app:cached
    environment:
      - ENVIRONMENT=development
      - DEBUG=True
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-lgtm:4318
    working_dir: /app
    depends_on:
      otel-lgtm:
        condition: service_started

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
      target: development
    container_name: app-frontend
    ports:
      - "4200:4200"
    volumes:
      # Mount source code for hot reload
      - ./src/frontend/src:/app/src:cached
      # Mount config files (read-only)
      - ./src/frontend/angular.json:/app/angular.json:ro
      - ./src/frontend/tsconfig.json:/app/tsconfig.json:ro
      - ./src/frontend/tsconfig.app.json:/app/tsconfig.app.json:ro
      - ./src/frontend/proxy.conf.json:/app/proxy.conf.json:ro
      # Use named volume for node_modules to avoid platform conflicts
      - frontend_node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    depends_on:
      - backend
    stdin_open: true
    tty: true

volumes:
  frontend_node_modules:
