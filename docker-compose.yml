services:
  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
      target: development
    container_name: app-backend
    ports:
      - "8000:8000"
      - "5678:5678"  # debugpy remote attach
    volumes:
      - ./src/backend:/app:cached
    environment:
      - ENVIRONMENT=development
      - DEBUG=True
    working_dir: /app

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
      target: development
    container_name: app-frontend
    ports:
      - "4200:4200"
    volumes:
      # Mount source code for hot reload
      - ./src/frontend/src:/app/src:cached
      # Mount config files (read-only)
      - ./src/frontend/angular.json:/app/angular.json:ro
      - ./src/frontend/tsconfig.json:/app/tsconfig.json:ro
      - ./src/frontend/tsconfig.app.json:/app/tsconfig.app.json:ro
      - ./src/frontend/proxy.conf.json:/app/proxy.conf.json:ro
      # Use named volume for node_modules to avoid platform conflicts
      - frontend_node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    depends_on:
      - backend
    stdin_open: true
    tty: true

volumes:
  frontend_node_modules:
